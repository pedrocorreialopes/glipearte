<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Área do Cliente Glipearte</title>
  <meta name="description" content="Acesse sua conta na Glipearte. Acompanhe agendamentos, pedidos e histórico de locações.">
  <meta name="robots" content="noindex, follow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/animations.css">
</head>
<body class="auth-page">
  <a href="#main-content" class="skip-link">Pular para conteúdo principal</a>
  <header class="site-header auth-header" id="topo">
    <div class="container header-inner">
      <a class="logo" href="../index.html" aria-label="Glipearte Pegue e Monte - Página inicial">
        <img src="../images/logo-glipearte.svg" alt="Glipearte Pegue e Monte" width="180" height="60">
      </a>
    </div>
  </header>

  <main id="main-content">
    <section class="auth-section" aria-labelledby="login-title">
      <div class="container">
        <div class="auth-card reveal">
          <h1 id="login-title">Área do Cliente</h1>
          <p>Entre para acompanhar seus agendamentos, pedidos e histórico.</p>
          <form class="auth-form" id="login-form" action="#" method="post" novalidate>
            <div class="form-group">
              <label for="login-email">E-mail <span aria-label="obrigatório">*</span></label>
              <input type="email" id="login-email" name="email" required aria-required="true" autocomplete="email">
              <span class="error-message" aria-live="polite"></span>
            </div>
            <div class="form-group">
              <label for="login-password">Senha <span aria-label="obrigatório">*</span></label>
              <div class="password-wrapper">
                <input type="password" id="login-password" name="password" required aria-required="true" autocomplete="current-password">
                <button type="button" class="toggle-password" aria-label="Mostrar senha" data-target="login-password">👁</button>
              </div>
              <span class="error-message" aria-live="polite"></span>
            </div>
            <div class="form-options">
              <label class="form-check"><input type="checkbox" name="remember"> Lembrar de mim</label>
              <a href="#" class="link-small">Esqueceu a senha?</a>
            </div>
            <button type="submit" class="btn btn-primary btn-lg">Entrar</button>
            <div class="form-feedback" role="status" aria-live="polite"></div>
          </form>
          <div class="auth-footer">
            <p>Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
            <p><a href="../index.html">Voltar para o site</a></p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer compact">
    <div class="container">
      <div class="footer-bottom">
        <p>© <span id="year"></span> Glipearte Pegue e Monte. Todos os direitos reservados.</p>
        <p>Desenvolvido por <strong>Pedro Correia Lopes Filho</strong>.</p>
      </div>
    </div>
  </footer>

  <script src="../js/main.js" defer></script>
  <script src="../js/forms.js" defer></script>
  <script src="../js/auth.js" defer></script>
</body>
</html>
